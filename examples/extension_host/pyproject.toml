[project]
name = "example-extension-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["arras==0.5.1"]

[project.scripts]
extension-host-example = "extension_host.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extension_host"]
include = ["src/extension_host/config/*.toml"]
