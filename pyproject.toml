[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
name = "arras"
version = "0.6.0"
description = "The interface to an ontology: UMF types and actions, freshness-stating reads, Truss and Ashlar backends."
readme = "README.md"
keywords = ["ontology", "umf", "truss", "ashlar", "graphql", "data-access", "freshness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "graphql-core>=3.3,<3.4",
]

[project.urls]
Homepage = "https://github.com/DocumentDrivenDX/arras"
Repository = "https://github.com/DocumentDrivenDX/arras"
Issues = "https://github.com/DocumentDrivenDX/arras/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27,<2",
]
devhost = [
    "uvicorn>=0.30",
]
# The Truss adapter (ADR-006, ADR-010): the pinned toolkit with its psycopg driver and Weft. Neither
# the toolkit nor Weft is on PyPI, so they resolve from the committed find-links page
# (tools/find-links/index.html), whose anchors carry the releases' SHA256SUMS digests; uv.lock
# records them as hashes and `uv sync --locked` verifies every wheel. The base install needs none of it.
truss = [
    "truss-toolkit[native,query]==0.0.49",
]
# Official released UMF Python core, selected by URL and content digest rather than version alone.
umf = [
    "umf-core @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.4/umf_core-0.10.0-py3-none-any.whl#sha256=49633924b45a3c8499d4fcc1a24c30d5a8fcb34d974ab019bbda987cb47da0f9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arras"]
# The UI build output is gitignored, and hatch leaves out what git ignores unless it is named here.
artifacts = ["src/arras/ui/static/**", "src/arras/ui/npm/*.tgz"]

[tool.hatch.build.targets.sdist]
exclude = ["/ui", "/docs", "/.claude"]
# `uv build` builds the wheel from the sdist, so the sdist carries the UI build too.
artifacts = ["src/arras/ui/static/**", "src/arras/ui/npm/*.tgz"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "hypothesis>=6.100",
    "opentelemetry-sdk>=1.27,<2",
    "uvicorn>=0.30",
]
# The local PostgreSQL 18.6 the Truss test harness runs on (pgserver-pg18, from the same find-links
# page). Never part of `dev`: only the `truss` job and a developer running `pytest -m truss` need it.
# It has wheels for Linux x86_64 and aarch64 and macOS 14+ arm64 on Python 3.11 to 3.13, no sdist.
truss-test = [
    "truss-toolkit[local]==0.0.49",
]

[tool.uv]
find-links = ["tools/find-links/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `truss` need a real Truss on PostgreSQL 18.6: `pytest -m truss` selects them (a
# command-line -m replaces this one), and a bare `pytest` leaves them out.
addopts = "-m 'not truss'"
markers = ["truss: needs a real Truss on PostgreSQL 18.6 (uv run --extra truss pytest -m truss)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0915"]
# the formatter keeps code to the line length; it does not break strings or long names
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# A ceiling at the worst function today (`umf._relationships` and others, 16), never raised: lower
# it as functions are split. A new function over it fails the lint.
max-complexity = 16

[tool.ruff.lint.pylint]
# The same for function length: the worst function today (`fakes._effects`, 43 statements).
max-statements = 43


[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "tests", extraPaths = ["examples/extension_host/src"] },
    { root = "." },
]
