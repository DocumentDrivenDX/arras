<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The static read-only host (ADR-031): no inline script, no style attribute the page sets, no eval, and no
         request but to its own files. The policy is the page's own so a static file host need set no header. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'"
    />
    <title>Arras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/static/host.tsx"></script>
  </body>
</html>
