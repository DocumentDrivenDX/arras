name: Release

# Tag-driven release: push a tag vX.Y.Z whose version matches pyproject.toml and ui/package version
# metadata. The same tests as pull requests run first (ci.yml), then the wheel, sdist and npm
# package are built, installed into fresh environments and smoke-tested, and only then published:
# PyPI by trusted publishing (environment `pypi`), npm with provenance (environment `npm`), then a
# GitHub Release carrying the artifacts and SHA256SUMS. A failed release is fixed and re-tagged as
# the next patch version.
#
# `workflow_dispatch` is a dry run: it builds and smoke-tests the current ref but never publishes.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test only; this workflow never publishes from a dispatch.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build wheel, sdist and npm package
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version and, on a tag, check it matches
        run: |
          version=$(python3 - <<'PY'
          import re, tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "a dispatch is always a dry run; publish by pushing a version tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI package carried by the wheel
        working-directory: ui
        run: |
          npm ci
          npm run build:wheel
      - name: Build the wheel and sdist
        run: uv build
      - name: Collect the artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release/pypi
          cp dist/* release/pypi/
          cp "src/arras/ui/npm/documentdrivendx-arras-ui-${VERSION}.tgz" release/
          (cd release && sha256sum pypi/* documentdrivendx-arras-ui-*.tgz > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/pypi/*
            release/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  smoke:
    name: Install the built artifacts in fresh environments
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Fresh install with the devhost extra, doctor and dev host
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/v"
          uv pip install --python "$RUNNER_TEMP/v/bin/python" "$(ls release/pypi/arras-*.whl)[devhost]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            --version "$VERSION" --examples "$GITHUB_WORKSPACE/examples/catalog"
      - name: Fresh install of the sdist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/s"
          uv pip install --python "$RUNNER_TEMP/s/bin/python" "$(ls release/pypi/arras-*.tar.gz)[devhost]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/s/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --version "$VERSION"
      - name: Fresh install with the truss and umf extras resolves from PyPI
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/x"
          uv pip install --python "$RUNNER_TEMP/x/bin/python" "$(ls release/pypi/arras-*.whl)[truss,umf]"
          uv pip check --python "$RUNNER_TEMP/x/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/x/bin/python" -I -c "import arras, truss, umf, importlib.metadata as m; print(m.version(\"arras\"))"
      - name: The npm package compiles and renders in an isolated consumer
        working-directory: ui
        run: |
          npm ci
          node scripts/smoke-npm-consumer.mjs ../release/documentdrivendx-arras-ui-*.tgz ../src/arras/public-api.json

  integration:
    name: Real Truss on PostgreSQL 18.6
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss --extra umf --extra devhost --group truss-test
      - run: uv run --no-sync pytest -q -m truss

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [test, build, smoke, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/pypi/

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: [test, build, smoke, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish release/documentdrivendx-arras-ui-*.tgz --provenance --access public

  github-release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/pypi/* release/*.tgz release/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  pages:
    name: Documentation site
    needs: github-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
