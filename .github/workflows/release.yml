name: Release

# On a tag `vX.Y.Z` that matches the pyproject version: gate (the Truss suite and the build job's
# checks), build the UI, the wheel and the sdist, then publish to PyPI (trusted publishing, the `pypi`
# environment), publish the npm package `@documentdrivendx/arras-ui` with provenance, and create a
# GitHub release carrying the wheel, the sdist and the npm tarball.
#
# The wheel and the npm tarball carry the UI build. A git install
# (`arras @ git+https://github.com/DocumentDrivenDX/arras@vX.Y.Z`) builds the Python package from the
# tag without it, because main never carries build output: use the wheel for the console.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag names the version in pyproject.toml.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  # The Truss adapter on the pinned release and PostgreSQL 18.6, as ci.yml runs it: a release is held
  # to the same evidence as a change.
  truss:
    name: Truss adapter on PostgreSQL 18.6
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss --group truss-test
      - run: uv run --no-sync pytest -m truss -q
        env:
          ARRAS_REQUIRE_TRUSS: "1"

  build:
    needs: [check, truss]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      # The wheel carries the UI: the page and the npm tarball built from ui/ (ADR-027).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build:wheel
        working-directory: ui
      - run: uv build --wheel && uv build --sdist
      - name: The wheel installs on a clean interpreter and carries the UI
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "import importlib.util, arras, arras.ui, arras.adapters.truss; assert importlib.util.find_spec('truss') is None, 'the base wheel must not need Truss'; print(arras.CONTRACT_VERSIONS, arras.ui.npm_package().name); assert (arras.ui.STATIC / arras.ui.PAGE).is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # PyPI trusted publishing: no token; the project's trusted publisher names this workflow and the
  # `pypi` environment.
  publish-pypi:
    needs: [build, truss]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The npm package is the tarball inside the wheel, taken from it so the two cannot differ. Published
  # with provenance (id-token) using the `NPM_TOKEN` secret of the `npm` environment.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Publish the package carried by the wheel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          unzip -j -d npm dist/*.whl 'arras/ui/npm/*.tgz'
          # `./`: without it npm reads `npm/x.tgz` as the GitHub repository `npm/x.tgz`
          npm publish ./npm/*.tgz --access public --provenance

  github-release:
    needs: [check, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          unzip -j -d npm dist/*.whl 'arras/ui/npm/*.tgz'
          tag="${{ needs.check.outputs.tag }}"
          gh release create "${tag}" dist/*.whl dist/*.tar.gz npm/*.tgz \
            --title "${tag}" --generate-notes --verify-tag \
            --notes "Install from PyPI (\`pip install arras\`) or from git: \`arras @ git+https://github.com/DocumentDrivenDX/arras@${tag}\`. The wheel and the attached npm tarball carry the UI build; a git install builds the Python package without it."
