name: Arras 0.7.1 producer byte comparison

on:
  pull_request:
    paths: [.github/workflows/arras071-producer-diagnostic.yml]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arras071-producer-byte-comparison
          run-id: 41563181620
          github-token: ${{ github.token }}
          path: captured
      - name: Prepare the same-input gzip reproduction
        run: |
          mkdir -p artifacts
          cat > "$RUNNER_TEMP/gzip-probe.mjs" <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gzipSync, gunzipSync} from 'node:zlib';
          const sha = data => createHash('sha256').update(data).digest('hex');
          const archive = readFileSync('captured/node24/documentdrivendx-arras-ui-0.7.1.tgz');
          if (sha(archive) !== '984599a5227dc24edf7097c0011ba09a4dfd1a2c168e057dd9a96df1c5db0a5f') throw new Error('captured archive changed');
          const raw = gunzipSync(archive);
          if (sha(raw) !== 'c822197cac7447f6342ec076864ec4794f6974d34f0eab829a421c7373c95c46') throw new Error('captured tar input changed');
          const encoded = gzipSync(raw, {level: 9});
          encoded[9] = 255; // npm's observed portable gzip OS byte; raw tar is unchanged.
          const report = {
            schema: 'arras.same-input-gzip-reproduction/1',
            source_sha: '0f7817eb15ee73d1d62eb75c7fe87caa3aa1aa65',
            input_archive_sha256: sha(archive), input_tar_sha256: sha(raw),
            input_bytes: raw.length, gzip_level: 9, portable_os_byte: 255,
            recompressed_sha256: sha(encoded), reproduces_captured_archive: encoded.equals(archive),
            producer: {platform:process.platform, arch:process.arch, versions:process.versions, sharedZlib:process.config.variables.node_shared_zlib},
          };
          writeFileSync(`artifacts/${process.argv[2]}-gzip-reproduction.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: node "$RUNNER_TEMP/gzip-probe.mjs" node24
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - run: node "$RUNNER_TEMP/gzip-probe.mjs" node26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arras071-gzip-forensics
          path: artifacts/
          if-no-files-found: error
