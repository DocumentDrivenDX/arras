name: CI

# One workflow for the software's tests. Linux only. Pull requests and pushes to main run the
# default Python suite and the UI unit/integration tests; the nightly job adds the slow suite,
# the real-Truss tests and the browser tests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss --extra umf --extra devhost
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q -m 'not truss and not slow'

  ui:
    name: UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked --extra devhost
      - run: npm ci
        working-directory: ui
      - run: npm run check && npm run typecheck && npm test
        working-directory: ui
      - run: npm run test:integration
        working-directory: ui

  size-guard:
    name: Tree size guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_tree_size.py

  nightly:
    name: Nightly (slow, real Truss, browser)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --locked --extra truss --extra umf --extra devhost --group truss-test
      - run: uv run --no-sync pytest -q -m 'truss or slow'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run e2e
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ui/test-results/
          retention-days: 14
          if-no-files-found: ignore
