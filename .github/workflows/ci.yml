name: CI

# The checks a change must pass before it merges. release.yml runs the same gate on a tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      source_tree_sha: ${{ steps.candidate.outputs.source_tree_sha }}
      pull_request_head_sha: ${{ steps.candidate.outputs.pull_request_head_sha }}
      wheel_name: ${{ steps.candidate.outputs.wheel_name }}
      wheel_version: ${{ steps.candidate.outputs.wheel_version }}
      wheel_sha256: ${{ steps.candidate.outputs.wheel_sha256 }}
      producer_run_id: ${{ steps.candidate.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.candidate.outputs.producer_run_attempt }}
      producer_event: ${{ steps.candidate.outputs.producer_event }}
      candidate_artifact_id: ${{ steps.candidate_artifact.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidate_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss --extra umf
      - name: Verify declared public origins and fixture provenance
        run: uv run --no-sync python tools/check_public_content.py
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      # The wheel carries the UI: the page and the npm tarball built from ui/ (ADR-027).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build:wheel
        working-directory: ui
      - run: uv build --wheel && uv build --sdist
      - name: Verify exact source and sdist-rebuilt artifacts
        run: python tools/verify_distribution.py --output artifacts/distribution-verification.json dist/*.whl dist/*.tar.gz
      - name: Verify installed extension host with fresh public dependencies
        run: python tools/verify_extension_host.py --wheel dist/arras-*.whl --output-json artifacts/extension-host-fresh-dependencies.json --fresh-dependencies
      - name: Verify installed UMF admission with fresh environments
        run: |
          mkdir -p artifacts
          uv run --no-sync python tools/verify_umf_admission.py --wheel dist/arras-*.whl --output-json artifacts/umf-admission-installed.json
      - name: Record exact candidate wheel provenance
        id: candidate
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import email
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree_sha = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          pr_head_sha = os.environ["PULL_REQUEST_HEAD_SHA"]
          if (
              actual_sha != source_sha
              or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", tree_sha) is None
              or (pr_head_sha and re.fullmatch(r"[0-9a-f]{40}", pr_head_sha) is None)
          ):
              raise SystemExit("candidate checkout does not match the producing source SHA")
          if subprocess.run(["git", "diff", "--quiet"], check=False).returncode != 0 or subprocess.run(
              ["git", "diff", "--cached", "--quiet"], check=False
          ).returncode != 0:
              raise SystemExit("candidate build changed tracked checkout content")
          wheels = sorted(Path("dist").glob("arras-*.whl"))
          if len(wheels) != 1 or wheels[0].is_symlink() or not wheels[0].is_file():
              raise SystemExit("expected exactly one regular Arras wheel")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit("candidate wheel must contain exactly one METADATA")
              metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
          if metadata.get("Name", "").lower().replace("_", "-") != "arras":
              raise SystemExit("candidate wheel metadata name is not Arras")
          version = metadata.get("Version", "")
          if not version or re.fullmatch(r"[A-Za-z0-9.!+_-]+", version) is None:
              raise SystemExit("candidate wheel metadata version is invalid")
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          receipt = {
              "schema": "arras.ci-candidate-wheel/1",
              "source_sha": source_sha,
              "checkout_head": actual_sha,
              "source_tree_sha": tree_sha,
              "pull_request_head_sha": pr_head_sha or None,
              "run_id": os.environ["PRODUCER_RUN_ID"],
              "run_attempt": os.environ["PRODUCER_RUN_ATTEMPT"],
              "event": os.environ["PRODUCER_EVENT"],
              "wheel": {"name": wheel.name, "version": version, "sha256": digest},
          }
          Path("artifacts/candidate-wheel-provenance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in {
                  "source_sha": source_sha,
                  "source_tree_sha": tree_sha,
                  "pull_request_head_sha": pr_head_sha,
                  "wheel_name": wheel.name,
                  "wheel_version": version,
                  "wheel_sha256": digest,
                  "producer_run_id": os.environ["PRODUCER_RUN_ID"],
                  "producer_run_attempt": os.environ["PRODUCER_RUN_ATTEMPT"],
                  "producer_event": os.environ["PRODUCER_EVENT"],
              }.items():
                  output.write(f"{key}={value}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arras-umf-admission-installed
          path: artifacts/umf-admission-installed.json
          if-no-files-found: warn
      - name: The wheel installs on a clean interpreter and carries the UI
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "import importlib.util, arras, arras.ui, arras.adapters.truss; assert importlib.util.find_spec('truss') is None, 'the base wheel must not need Truss'; print(arras.CONTRACT_VERSIONS, arras.ui.npm_package().name); assert (arras.ui.STATIC / arras.ui.PAGE).is_file()"

      - name: Retain exact installed candidate artifacts
        uses: actions/upload-artifact@v4
        id: candidate_artifact
        with:
          name: arras-installed-candidate-artifacts
          path: |
            dist/arras-*.whl
            dist/arras-*.tar.gz
            artifacts/umf-admission-installed.json
            artifacts/candidate-wheel-provenance.json
          if-no-files-found: error

  native-macos:
    name: Installed native adapter on macOS arm64
    needs: [check]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_sha }}
      - name: Assert the exact producer source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          EXPECTED_SOURCE_TREE_SHA: ${{ needs.check.outputs.source_tree_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          architecture: arm64
      - name: Require the qualified macOS arm64 Python runtime
        run: |
          python - <<'PY'
          import platform
          import sys
          mac_version = platform.mac_ver()[0]
          if (
              platform.system() != "Darwin"
              or platform.machine() != "arm64"
              or platform.python_implementation() != "CPython"
              or sys.version_info[:3] != (3, 11, 9)
              or not mac_version
              or int(mac_version.split(".", 1)[0]) != 15
          ):
              raise SystemExit("native qualification requires macOS arm64 with CPython 3.11.9")
          PY
      - name: Initialize retained native qualification evidence
        run: |
          mkdir -p artifacts
          printf '%s\n' '{"schema_version":1,"status":"not_started"}' > artifacts/native-macos-verification.json
          : > artifacts/native-macos-verifier.stdout.log
          : > artifacts/native-macos-verifier.stderr.log
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.check.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: candidate-artifacts
      - name: Validate same-run candidate provenance and select the exact wheel
        env:
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          SOURCE_TREE_SHA: ${{ needs.check.outputs.source_tree_sha }}
          PULL_REQUEST_HEAD_SHA: ${{ needs.check.outputs.pull_request_head_sha }}
          WHEEL_NAME: ${{ needs.check.outputs.wheel_name }}
          WHEEL_VERSION: ${{ needs.check.outputs.wheel_version }}
          WHEEL_SHA256: ${{ needs.check.outputs.wheel_sha256 }}
          PRODUCER_RUN_ID: ${{ needs.check.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.check.outputs.producer_run_attempt }}
          PRODUCER_EVENT: ${{ needs.check.outputs.producer_event }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.check.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.check.outputs.candidate_artifact_digest }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import email
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != source_sha:
              raise SystemExit("consumer checkout differs from the candidate producer source")
          tree_sha = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if tree_sha != os.environ["SOURCE_TREE_SHA"]:
              raise SystemExit("consumer checkout tree differs from the candidate producer tree")
          if subprocess.run(["git", "diff", "--quiet"], check=False).returncode != 0 or subprocess.run(
              ["git", "diff", "--cached", "--quiet"], check=False
          ).returncode != 0:
              raise SystemExit("consumer checkout has tracked source modifications")
          root = Path("candidate-artifacts")
          if not root.is_dir() or root.is_symlink():
              raise SystemExit("candidate artifact root is missing or unsafe")
          expected = {
              f"dist/{os.environ['WHEEL_NAME']}",
              "artifacts/umf-admission-installed.json",
              "artifacts/candidate-wheel-provenance.json",
          }
          wheels = list((root / "dist").glob("arras-*.whl"))
          archives = list((root / "dist").glob("arras-*.tar.gz"))
          if len(wheels) != 1 or len(archives) != 1 or not archives[0].name.startswith("arras-"):
              raise SystemExit("candidate artifact must contain one Arras wheel and one sdist")
          all_paths = list(root.rglob("*"))
          if any(path.is_symlink() for path in all_paths):
              raise SystemExit("candidate artifact must not contain symbolic links")
          actual_files = {p.relative_to(root).as_posix() for p in all_paths if p.is_file()}
          if actual_files != expected | {f"dist/{archives[0].name}"}:
              raise SystemExit("candidate artifact contains missing or unexpected files")
          wheel = wheels[0]
          if wheel.name != os.environ["WHEEL_NAME"] or wheel.is_symlink():
              raise SystemExit("candidate artifact wheel name differs from producer output")
          provenance = json.loads((root / "artifacts/candidate-wheel-provenance.json").read_text(encoding="utf-8"))
          expected_provenance = {
              "schema": "arras.ci-candidate-wheel/1",
              "source_sha": source_sha,
              "checkout_head": source_sha,
              "source_tree_sha": os.environ["SOURCE_TREE_SHA"],
              "pull_request_head_sha": os.environ["PULL_REQUEST_HEAD_SHA"] or None,
              "run_id": os.environ["PRODUCER_RUN_ID"],
              "run_attempt": os.environ["PRODUCER_RUN_ATTEMPT"],
              "event": os.environ["PRODUCER_EVENT"],
              "wheel": {"name": wheel.name, "version": os.environ["WHEEL_VERSION"], "sha256": os.environ["WHEEL_SHA256"]},
          }
          if provenance != expected_provenance:
              raise SystemExit("candidate provenance does not match this workflow run")
          artifact_digest = os.environ["CANDIDATE_ARTIFACT_DIGEST"]
          if (
              not re.fullmatch(r"[0-9]+", os.environ["CANDIDATE_ARTIFACT_ID"])
              or re.fullmatch(r"(?:sha256:)?[0-9a-f]{64}", artifact_digest) is None
          ):
              raise SystemExit("producer artifact identity or digest is malformed")
          if (
              os.environ["GITHUB_RUN_ID"] != os.environ["PRODUCER_RUN_ID"]
              or os.environ["GITHUB_RUN_ATTEMPT"] != os.environ["PRODUCER_RUN_ATTEMPT"]
              or os.environ["GITHUB_EVENT_NAME"] != os.environ["PRODUCER_EVENT"]
          ):
              raise SystemExit("candidate artifact belongs to another workflow run or attempt")
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if digest != os.environ["WHEEL_SHA256"] or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("downloaded candidate wheel differs from its producer digest")
          with zipfile.ZipFile(wheel) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit("candidate wheel must contain exactly one METADATA")
              metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
          if metadata.get("Name", "").lower().replace("_", "-") != "arras" or metadata.get("Version") != os.environ["WHEEL_VERSION"]:
              raise SystemExit("downloaded candidate wheel metadata differs from producer output")
          consumer = {
              "schema": "arras.ci-native-consumer/1",
              "source_sha": source_sha,
              "source_tree_sha": tree_sha,
              "pull_request_head_sha": os.environ["PULL_REQUEST_HEAD_SHA"] or None,
              "consumer_head": source_sha,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "job": os.environ["GITHUB_JOB"],
              "host": {
                  "system": platform.system(),
                  "release": platform.release(),
                  "macos_product_version": platform.mac_ver()[0],
                  "python_implementation": platform.python_implementation(),
                  "machine": platform.machine(),
                  "python": platform.python_version(),
                  "python_executable": str(Path(sys.executable).resolve()),
                  "runner_image_os": os.environ.get("ImageOS"),
                  "runner_image_version": os.environ.get("ImageVersion"),
              },
              "artifact": {
                  "name": "arras-installed-candidate-artifacts",
                  "id": os.environ["CANDIDATE_ARTIFACT_ID"],
                  "server_digest": artifact_digest if artifact_digest.startswith("sha256:") else f"sha256:{artifact_digest}",
              },
              "tool_sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in [Path(".github/scripts/bind_native_cohort.py"), Path("tools/verify_native.py"), Path(".github/scripts/observe_native_cleanup.py"), *sorted(Path("tools").glob("_native_*.py"))]
              },
              "cohort_template_sha256": hashlib.sha256(Path("tests/downstream/native-cohorts/macos-arm64.json").read_bytes()).hexdigest(),
              "find_links_sha256": hashlib.sha256(Path("tests/downstream/native-cohorts/macos-arm64.find-links.html").read_bytes()).hexdigest(),
              "producer": {"run_id": provenance["run_id"], "run_attempt": provenance["run_attempt"], "event": provenance["event"]},
              "wheel": provenance["wheel"],
              "artifact_layout": sorted(actual_files),
          }
          Path("artifacts/native-macos-consumer-provenance.json").write_text(
              json.dumps(consumer, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Bind the exact candidate wheel to the reviewed macOS cohort
        env:
          WHEEL_NAME: ${{ needs.check.outputs.wheel_name }}
          WHEEL_VERSION: ${{ needs.check.outputs.wheel_version }}
          WHEEL_SHA256: ${{ needs.check.outputs.wheel_sha256 }}
        run: |
          python .github/scripts/bind_native_cohort.py \
            --template tests/downstream/native-cohorts/macos-arm64.json \
            --find-links tests/downstream/native-cohorts/macos-arm64.find-links.html \
            --wheel "candidate-artifacts/dist/$WHEEL_NAME" \
            --expected-version "$WHEEL_VERSION" \
            --expected-sha256 "$WHEEL_SHA256" \
            --output-json artifacts/native-macos-cohort.bound.json \
            --receipt-json artifacts/native-macos-cohort-binding.json
      - name: Run the complete installed-native verifier
        env:
          WHEEL_NAME: ${{ needs.check.outputs.wheel_name }}
        run: |
          set +e
          python .github/scripts/observe_native_cleanup.py \
            --output-json artifacts/native-macos-cleanup-observation.json \
            --stdout artifacts/native-macos-verifier.stdout.log \
            --stderr artifacts/native-macos-verifier.stderr.log \
            -- python tools/verify_native.py \
              --wheel "candidate-artifacts/dist/$WHEEL_NAME" \
              --cohort artifacts/native-macos-cohort.bound.json \
              --find-links tests/downstream/native-cohorts/macos-arm64.find-links.html \
              --output-json artifacts/native-macos-verification.json \
              --python "$(command -v python)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            receipt_status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("artifacts/native-macos-verification.json").read_text()).get("status", "unknown"))' 2>/dev/null || printf unknown)"
            if [ "$receipt_status" != "passed" ] && [ "$receipt_status" != "failed" ]; then
              if ! python .github/scripts/ensure_native_receipt_failure.py \
                --receipt artifacts/native-macos-verification.json \
                --exit-code "$status"; then
                printf '%s\n' 'native receipt normalization failed; see retained logs' >&2 || :
              fi
            fi
          fi
          exit "$status"
      - name: Ensure native cleanup evidence exists
        if: always()
        run: |
          if [ ! -s artifacts/native-macos-cleanup-observation.json ]; then
            mkdir -p artifacts
            printf '%s\n' '{"schema":"arras.native-independent-cleanup/3","status":"unknown","reason":"cleanup_observer_did_not_write_receipt"}' > artifacts/native-macos-cleanup-observation.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-native-macos-arm64-qualification
          path: |
            tests/downstream/native-cohorts/macos-arm64.json
            tests/downstream/native-cohorts/macos-arm64.find-links.html
            candidate-artifacts/artifacts/candidate-wheel-provenance.json
            artifacts/native-macos-consumer-provenance.json
            artifacts/native-macos-cohort.bound.json
            artifacts/native-macos-cohort-binding.json
            artifacts/native-macos-verification.json
            artifacts/native-macos-cleanup-observation.json
            artifacts/native-macos-verifier.stdout.log
            artifacts/native-macos-verifier.stderr.log
          if-no-files-found: ignore

  ui:
    name: Operator Console UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The integration tier and Playwright start the real dev host: Python through uv.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      # UMF's schema browser: the exact pin, the lockfile's integrity equal to the registry's, and the
      # registry tarball equal to the GitHub release's digest (scripts/umf-schema-browser.ts).
      - run: npm run check:umf -- --download
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run check:umf -- --dist dist
      # The library build: its stylesheet must reach nothing outside `.arras-root` (ADR-027).
      - run: npm run build:lib && npm run check:css -- dist-lib/styles.css
      # Every bare import in the library build is a dependency or a peer of the packed manifest.
      - run: npm run check:externals
      - name: Configure official Ubuntu HTTPS sources and bounded APT
        working-directory: .
        run: |
          set -euo pipefail
          python3 .github/scripts/configure_ubuntu_apt_sources.py --self-test
          sudo python3 .github/scripts/configure_ubuntu_apt_sources.py --apply
          if ! apt_main_config="$(sudo apt-config shell ARRAS_MAIN Dir::Etc::main/f 2>/dev/null)"; then
            printf '%s\n' "$apt_main_config" >&2
            exit 1
          fi
          if [ "$apt_main_config" != "ARRAS_MAIN='/etc/apt/apt.conf'" ]; then
            printf '%s\n' "$apt_main_config" >&2
            exit 1
          fi
          apt_main_path=/etc/apt/apt.conf
          if sudo test -e "$apt_main_path" || sudo test -L "$apt_main_path"; then
            if ! sudo test -f "$apt_main_path" || sudo test -L "$apt_main_path"; then
              printf '%s\n' "$apt_main_config" >&2
              exit 1
            fi
          fi
          sudo tee -a "$apt_main_path" >/dev/null <<'EOF'

          Acquire {
            Retries "2";
            http::Timeout "20";
            https::Timeout "20";
          };
          Binary::apt-get::Acquire {
            Retries "2";
            http::Timeout "20";
            https::Timeout "20";
          };
          EOF
          if ! apt_config="$(sudo apt-config shell ARRAS_RETRIES Acquire::Retries ARRAS_HTTP_TIMEOUT Acquire::http::Timeout ARRAS_HTTPS_TIMEOUT Acquire::https::Timeout ARRAS_APTGET_RETRIES Binary::apt-get::Acquire::Retries ARRAS_APTGET_HTTP_TIMEOUT Binary::apt-get::Acquire::http::Timeout ARRAS_APTGET_HTTPS_TIMEOUT Binary::apt-get::Acquire::https::Timeout 2>/dev/null)"; then
            printf '%s\n' "$apt_config" >&2
            exit 1
          fi
          expected_apt_config="$(printf "ARRAS_RETRIES='2'\nARRAS_HTTP_TIMEOUT='20'\nARRAS_HTTPS_TIMEOUT='20'\nARRAS_APTGET_RETRIES='2'\nARRAS_APTGET_HTTP_TIMEOUT='20'\nARRAS_APTGET_HTTPS_TIMEOUT='20'")"
          if [ "$apt_config" != "$expected_apt_config" ]; then
            printf '%s\n' "$apt_config" >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=30s 180s sudo apt-get update
      - name: Install Chromium operating-system dependencies with bounded APT
        run: timeout --signal=TERM --kill-after=30s 240s npx --no-install playwright install-deps chromium
      - name: Install the Chromium revision pinned by this Playwright lock
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "20000"
        run: timeout --signal=TERM --kill-after=30s 240s npx --no-install playwright install chromium
      - name: Launch and record the pinned Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          timeout --signal=TERM --kill-after=10s 90s node --input-type=module <<'JS'
          import { writeFileSync, readFileSync, appendFileSync } from 'node:fs';
          import { chromium } from '@playwright/test';

          const playwrightTestVersion = JSON.parse(readFileSync('node_modules/@playwright/test/package.json', 'utf8')).version;
          const browser = await chromium.launch({ headless: true });
          try {
            const receipt = {
              browser: 'chromium',
              playwrightTestVersion,
              browserVersion: browser.version(),
              executablePath: chromium.executablePath(),
            };
            writeFileSync('../artifacts/arras-linux-chromium.json', JSON.stringify(receipt, null, 2) + '\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nLinux Chromium launch: Playwright ${receipt.playwrightTestVersion}, browser ${receipt.browserVersion}, executable ${receipt.executablePath}.\n`);
            console.log(JSON.stringify(receipt));
          } finally {
            await browser.close();
          }
          JS
      # The visual project (screenshots) is macOS only and is left out of the Linux run
      # (ui/README.md, "Visual baselines"). Locally `npm run e2e` runs every project.
      - run: npx playwright test --project=chromium --project=schema-admin --project=browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arras-linux-chromium
          path: artifacts/arras-linux-chromium.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra truss --extra umf
      # Weft's own parser, for the checks that hold Arras's statements and the memory adapter to it
      # (tests/test_weft_parser.py, test_weft_relational.py, test_reserved_names.py). It is a test tool,
      # never a dependency of the package: installed after the locked sync, which would remove it, from
      # Weft's public GitHub release, the exact version pinned and the SHA256SUMS file itself pinned
      # by digest before it vouches for the wheel.
      - name: Install Weft's parser (weft-sql 0.4.51)
        env:
          WEFT_VERSION: "0.4.51"
          WEFT_SUMS_SHA256: 62c9d8082eb2f446446d7b94ff7ef7f48769e3cd836e5641c2951069302a6c75
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/DocumentDrivenDX/weft/releases/download/v${WEFT_VERSION}"
          wheel="weft_sql-${WEFT_VERSION}-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          echo "${WEFT_SUMS_SHA256}  SHA256SUMS" | sha256sum -c -
          curl -fsSL --retry 3 -o "$wheel" "$base/$wheel"
          grep -E "^[0-9a-f]{64}  ${wheel}\$" SHA256SUMS | sha256sum -c -
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" "$wheel"
      # includes the conformance corpus, the boundary check over the library and the host-style tests;
      # --no-sync keeps Weft installed, and ARRAS_REQUIRE_WEFT turns a Weft check's skip into a failure
      - name: Compare every official UMF conformance vector
        run: uv run --no-sync pytest -q tests/test_umf_admission.py::test_official_current_conformance_vectors_and_empty_registry_admission
        env:
          ARRAS_REQUIRE_UMF: "1"
      - run: uv run --no-sync pytest -q
        env:
          ARRAS_REQUIRE_WEFT: "1"
          ARRAS_REQUIRE_UMF: "1"

  truss:
    name: Truss adapter on PostgreSQL 18.6
    runs-on: ubuntu-latest
    # The conformance run seeds through Truss (about 0.35 s per imported record) and registers modules: minutes, not seconds.
    # Truss prepares a module in its embedded V8: no Bun, no Node and no subprocess is needed on the runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra truss --group truss-test
      # `-m truss` on the command line replaces the default `-m 'not truss'`; it exits 5 if nothing is
      # selected. ARRAS_REQUIRE_TRUSS turns a harness that cannot run into a failure, not a skip.
      - run: uv run --no-sync pytest -m truss -q
        env:
          ARRAS_REQUIRE_TRUSS: "1"
